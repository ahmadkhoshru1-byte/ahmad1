plugins { id 'com.android.application' }

android {
    namespace 'ir.thesis.reader'
    compileSdk 34
    defaultConfig {
        applicationId "ir.thesis.reader"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
