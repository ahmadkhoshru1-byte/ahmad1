<style>
:root{--bg:#eceee8;--card:#fff;--ink:#23301f;--mut:#6b7566;--g:#2f5d3a;--y:#e0a82e;--r:#b5472f;--ln:#d9ddd2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media all{:root[data-theme="dark"]{color-scheme:dark;--bg:#161b14;--card:#202719;--ink:#e8ecdf;--mut:#9aa593;--g:#6fb27f;--y:#e8b84a;--r:#e0836c;--ln:#323b2c}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.7 Vazirmatn,Tahoma,sans-serif}
header{padding:18px 16px 8px;max-width:980px;margin:auto}
h1{margin:0;font-size:22px;font-weight:800}header p{margin:2px 0 0;color:var(--mut);font-size:13px}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;max-width:980px;margin:auto}
nav button{flex:none;border:1px solid var(--ln);background:var(--card);color:var(--ink);font:inherit;padding:6px 14px;border-radius:20px;cursor:pointer}
nav button.on{background:var(--g);color:#fff;border-color:var(--g)}
