name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk checklist-1405.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest checklist-1405.apk --title "APK" --notes "debug build"
